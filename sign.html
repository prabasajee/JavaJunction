<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="css/sign.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Marck+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../image/icons8 (2).png" />
  </head>

  <body>
    <header class="header">
      <a href="#" class="logo">
          <img src="../image/logo.png" alt="Logo">
      </a>
      <nav class="navbar">
          <a href="home.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="product.html">Products</a>
          <a href="service.html">Services</a>
          <a href="contact.html">Contact</a>
      </nav>
      <div class="icons">
          <div class="fas fa-search" id="search-btn"></div>
          <div class="fas fa-shopping-cart" id="cart-btn"></div> 
          <div class="fas fa-bars" id="menu-btn"></div>
      </div>
      <div class="search-form">
          <input type="search" id="search-box" placeholder="Search here...">
          <label for="search-box" class="fas fa-search"></label>
      </div>
      <li class="menu-nav__item">
          <a href="sign.html" class="sign-in menu-nav__link active">
            <i class="fa fa-user" aria-hidden="true"></i>
            Sign In
          </a>
          <span class="menu-nav__link" id="slash">/</span>
          <a href="signup.html" class="sign-up menu-nav__link">
            Sign Up
          </a>
        </li>
      <div class="cart-items-container">
          <div class="cart-item">
              <span class="fas fa-times"></span>
              <img src="../image/p3.png" alt="Cart Item 1">
              <div class="content">
                  <h3>Cart Item 01</h3>
                  <div class="price">Rs 1500</div>
              </div>
          </div>
          <div class="cart-item">
              <span class="fas fa-times"></span>
              <img src="../image/p4.png" alt="Cart Item 2">
              <div class="content">
                  <h3>Cart Item 02</h3>
                  <div class="price">Rs 1700</div>
              </div>
          </div>
          <div class="cart-item">
              <span class="fas fa-times"></span>
              <img src="../image/p5.png" alt="Cart Item 3">
              <div class="content">
                  <h3>Cart Item 03</h3>
                  <div class="price">Rs 1700</div>
              </div>
          </div>
          <div class="cart-item">
              <span class="fas fa-times"></span>
              <img src="../image/p1.png" alt="Cart Item 4">
              <div class="content">
                  <h3>Cart Item 04</h3>
                  <div class="price">Rs 1400</div>
              </div>
          </div>
          <a href="#" class="btn">Checkout Now</a>
      </div>
  </header>
  <body>
    <div id="wrapper">
        <div id="left">
            <div id="signin">
                <div class="logo">
                     <img src="../image/login-logo.png" alt="coffee pot">
                </div>  <!-- end of logo -->
                <form action="">
                  <h2 id="signin-title">Sign In</h2>
                    <div>
                        <label for="">Email or username</label>
                        <input type="text" class="text-input">
                    </div>
                    <div>
                        <label for="">Password</label>
                        <input type="password" class="text-input">
                    </div>
                    <button type="submit" class="primary-btn">Sign in</button>
                </form>
                <div class="links">
                    <a href="#">Forgot Password</a>
                    
                </div>
             
               
                </div> <!-- end of signin -->
                
                
        </div>  <!-- end of left -->
        <div id="right">
            <div id="showcase">
                <div class="showcase-content">
                    <h1 class="showcase-text">Let's brew together</h1>
                    <a href="#" class="secondary-btn">The best way to drink coffee</a>
                </div> <!-- end of showcase-content -->
            </div> <!-- end of showcase -->
        </div> <!-- end of right -->
    </div> <!-- end of wrapper -->
  </body>
</html>
